repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.4.0
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        # Ref abbrev, variable name, Mist mis-spelling
        # Passing config from toml does not work.
        args: ["-L", "mater,nd,coefficent,ot"]
        exclude: "uv.lock"

  - repo: https://github.com/johann-petrak/licenseheaders
    rev: v0.8.8
    hooks:
      - id: licenseheaders
        name: licenseheaders (src)
        pass_filenames: false
        args: ["-t", "scripts/bsd-3.tmpl", "--dir", "src", "--ext", ".py"]
      - id: licenseheaders
        name: licenseheaders (tests)
        pass_filenames: false
        args: ["-t", "scripts/bsd-3.tmpl", "--dir", "tests", "--ext", ".py"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  - repo: local
    hooks:
      - id: docs-harness
        name: docs harness
        entry: python3 scripts/check_docs_harness.py
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: suspicious-unicode
        name: Reject bidi and invisible Unicode
        entry: python3 scripts/check_unicode.py
        language: system
        types: [text]
