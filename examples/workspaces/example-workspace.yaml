thesis:
   solidification_part:
      configure:
         res: 25e-6
      execute:
         thesis-bin: 3DThesis
         batch: True
   temperature_surface_part:
      configure:
         res: 100e-6
         wait: 10.0
      execute:
         thesis-bin: 3DThesis
         batch: True
         use-prior-layer-average: True
   solidification_build_region:
      configure:
         res: 25e-6
      execute:
         thesis-bin: 3DThesis
         batch: True
   depth_map_part:
      configure:
         res: 25e-6
         z-res: 10e-6
      execute:
         thesis-bin: 3DThesis
         batch: True
exaca:
   microstructure_region:
      execute:
         exaca-bin: ExaCA
