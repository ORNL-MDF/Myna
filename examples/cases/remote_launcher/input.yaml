steps:
- 3dthesis:
    class: solidification_part
    application: thesis
    configure:
      res: 250.0e-6
    execute:
      np: 1
data:
  build:
    datatype: Peregrine
    name: myna_output
    path: ../../databases
    parts:
      P5:
        layers: [51]
myna:
  ignore_missing_layers: true
  compute:
    # Replace these values with your SSH host and remote Myna installation.
    host: hostname
    workdir: /home/user/path/to/myna-workspace
    command: /home/user/path/to/.venv/bin/myna
    workspace: /home/user/path/to/myna-workspace/remote-workspace.yaml
    data_location: local
    download: all
